name: Payment reminders

# Vercel's free (Hobby) plan only allows a cron job to run once a day, which
# isn't enough for escalating reminders (e.g. "every 2 hours the day
# before"). This workflow pings the same endpoint every 15 minutes instead,
# at no cost, so the granularity comes from here rather than Vercel Cron.

on:
  schedule:
    # Offset from the hour/half-hour marks (7, 22, 37, 52 instead of
    # 0/15/30/45) - GitHub's own scheduling docs note runs queued right at
    # those marks are the most likely to be delayed under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/cron/check-payments" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
